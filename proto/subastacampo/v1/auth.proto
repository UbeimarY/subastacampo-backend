syntax = "proto3";

package subastacampo.v1;

import "google/protobuf/timestamp.proto";
import "subastacampo/v1/common.proto";

// Account registration and authentication.
// Authenticated RPCs expect the header "Authorization: Bearer <access_token>".
service AuthService {
  // Creates an account. Fails with ALREADY_EXISTS if the email is taken.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Exchanges credentials for an access token.
  // Fails with UNAUTHENTICATED on wrong credentials.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Returns the user behind the access token.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message User {
  // UUID.
  string id = 1;
  string full_name = 2;
  string email = 3;
  UserRole role = 4;
  optional string phone = 5;
  optional string municipality = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RegisterRequest {
  string full_name = 1;
  string email = 2;
  // At least 8 characters. Never stored: only its hash is kept.
  string password = 3;
  UserRole role = 4;
  optional string phone = 5;
  optional string municipality = 6;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}
