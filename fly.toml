app = "subastacampo-api-ubeimar"
# Same metro area as the Neon database (AWS us-east-1): lowest latency.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BUSINESS_TIMEZONE = "America/Bogota"
  CORS_ORIGINS = '["http://localhost:4200","https://subastacampo-ubeimar.netlify.app"]'

[http_service]
  internal_port = 8000
  force_https = true
  # Always on until the end of the course: never stop for inactivity.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  