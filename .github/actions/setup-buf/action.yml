name: Set up Buf
description: Installs a pinned Buf release and verifies it against a pinned SHA-256.

inputs:
  version:
    description: Buf version to install
    default: "1.50.0"
  sha256:
    # Same value as buf-Linux-x86_64 in the GitHub release's sha256.txt.
    description: Expected SHA-256 of the Linux x86_64 binary for that version
    default: "154ea883ce098eac4fa106ff9ee4e4964bb97f809dd8ec9c34a432b466ce1494"

runs:
  using: composite
  steps:
    - name: Download and verify Buf
      shell: bash
      env:
        BUF_VERSION: ${{ inputs.version }}
        BUF_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        workdir="$RUNNER_TEMP/buf"
        mkdir -p "$workdir" && cd "$workdir"
        # Buf's official npm package ships the same binary as the GitHub release,
        # and the npm registry is far more reliable than release downloads in CI.
        url="https://registry.npmjs.org/@bufbuild/buf-linux-x64/-/buf-linux-x64-${BUF_VERSION}.tgz"
        # HTTPS only, including any redirect, with modern TLS; retry transient errors.
        curl --retry 4 --retry-delay 5 --retry-all-errors \
          --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfL -o buf.tgz "$url"
        tar -xzf buf.tgz package/bin/buf
        # The checksum lives in this repository: refuse a binary that does not match it.
        echo "${BUF_SHA256}  package/bin/buf" | sha256sum --check --strict
        mkdir -p "$HOME/.local/bin"
        install -m 0755 package/bin/buf "$HOME/.local/bin/buf"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/buf" --version
        