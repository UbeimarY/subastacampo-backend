name: Set up Buf
description: Installs a pinned Buf release and verifies it against a pinned SHA-256.

inputs:
  version:
    description: Buf version to install
    default: "1.50.0"
  sha256:
    # From the release's sha256.txt (buf-Linux-x86_64), cross-checked with the npm package.
    description: Expected SHA-256 of buf-Linux-x86_64 for that version
    default: "154ea883ce098eac4fa106ff9ee4e4964bb97f809dd8ec9c34a432b466ce1494"

runs:
  using: composite
  steps:
    - name: Download and verify Buf
      shell: bash
      env:
        BUF_VERSION: ${{ inputs.version }}
        BUF_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        workdir="$RUNNER_TEMP/buf"
        mkdir -p "$workdir" && cd "$workdir"
        url="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
        # HTTPS only, including any redirect, with modern TLS.
        # Release downloads sometimes answer 502/504: retry a few times before failing.
        curl --retry 4 --retry-delay 5 --retry-all-errors \
          --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfLO "$url"
        # The checksum lives in this repository, not on the download server:
        # refuse to continue if the binary does not match it.
        echo "${BUF_SHA256}  buf-Linux-x86_64" | sha256sum --check --strict
        mkdir -p "$HOME/.local/bin"
        install -m 0755 buf-Linux-x86_64 "$HOME/.local/bin/buf"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/buf" --version

        