[project]
name = "subastacampo"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ubeimar Yepes", email = "ubeimarlyepes@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "connectrpc>=0.13.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
subastacampo = "subastacampo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/subastacampo/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
