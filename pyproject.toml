[project]
name = "subastacampo"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ubeimar Yepes", email = "ubeimarlyepes@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "connectrpc>=0.13.0",
    "email-validator>=2.3.0",
    "protobuf>=7.36.2",
    "protobuf-py-pure>=0.7.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.7",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/subastacampo/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
